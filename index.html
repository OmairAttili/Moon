    <title>moon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

<body class="pb-12">
<header class="moon_navbar w-full py-[21.84px]">
  <div class="container mx-auto">
    <div class="navbar items-center flex justify-between">
        <div class="menu md:hidden max-md:ml-5">
            <button><img src="./src/img/Navbar/Menu.svg" class="cursor-pointer"/></button>
        </div>
  <div class="nav_img">
    <img src="./src/img/Navbar/logo.svg"/>
  </div>
  <div class="nav_links max-md:hidden">
    <nav>
      <ul class="flex gap-15">
        <li>
          <a class="text-sm font-Inter text-[#3A3845] hover:text-[#F7CCAC] transition-all" href="#">Home</a>
        </li>
        <li>
          <a class="text-sm font-Inter text-[#3A3845] hover:text-[#F7CCAC] transition-all" href="#">About</a>
        </li>
        <li>
          <a class="text-sm font-Inter text-[#3A3845] hover:text-[#F7CCAC] transition-all" href="#">Shop</a>
        </li>
        <li>
          <a class="text-sm font-Inter text-[#3A3845] hover:text-[#F7CCAC] transition-all" href="#">Contant</a>
        </li>
      </ul>
    </nav>
  </div>
  <div class="nav_icons flex gap-6 items-center">
    <button class="max-md:hidden transition-all hover:scale-90">
      <img src="./src/img/Navbar/Search.svg"class="cursor-pointer"/>
    </button>
    <button class="max-md:hidden transition-all hover:scale-90">
      <img src="./src/img/Navbar/Avatar.svg"class="cursor-pointer"/>
    </button>
    <button class="max-md:hidden transition-all hover:scale-90">
      <img src="./src/img/Navbar/Heart.svg"class="cursor-pointer"/>
    </button>
    <button class="max-md:mr-5 transition-all hover:scale-90">
      <img src="./src/img/Navbar/Shopping cart.svg"class="cursor-pointer"/>
    </button>
  </div>
  </div>
  </div>
</header>
<section class="hero md:bg-[url('./../img/Hero/slider.png')]">
    <div class="md:hidden">
            <div>
            <img src="./src/img/Hero/slider2.png" class="w-full"/>
        </div>
        <div class="bg-[#826F66] flex flex-col justify-center items-center pb-[47.21px]">
            <div class="pt-[47.21px] pb-7.5"><img src="./src/img/Hero/Icon.svg"/></div>
            <div class="text-center">
                <p class="text-[#FFFDFB] font-Inter pb-5">Handcrafted in Viet Nam since 1650</p>
                <p class="font-Garamond font-bold text-[36px] text-[#FFFDFB] pb-7.5">BAT TRANG <br/>DINNER SET</p>
            </div>
            <div class="bg-[#FFFFFF] w-55 h-10 flex justify-center hover:scale-90 transition-all cursor-pointer duration-300">
                <button class="text-[#826F66] font-Inter font-semibold text-[14px] cursor-pointer">SHOP NOW</button>
            </div>
        </div>
        </div>
    <div class="container mx-auto">
        <div class="bg-[#826F66] w-105 h-160 flex flex-col justify-center items-center gap-10 max-md:hidden">
            <div><img src="./src/img/Hero/Icon.svg"/></div>
            <div class="text-center">
                <p class="text-[#FFFDFB] font-Inter">Handcrafted in Viet Nam since 1650</p>

                <p class="font-Garamond font-bold text-[36px] text-[#FFFDFB]">BAT TRANG <br/>DINNER SET</p>
            </div>
            <div class="bg-[#FFFFFF] w-55 h-10 flex justify-center hover:scale-90 transition-all cursor-pointer duration-300">
                <button class="text-[#826F66] font-Inter font-semibold text-[14px] cursor-pointer">SHOP NOW</button>
            </div>
        </div>
    </div>
</section>
<section class="categories pt-20">
    <div class="container mx-auto grid justify-items-center max-sm:grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-7.5">
        <div class="text-center">
            <img src="./src/img/Categories/Tableware.png" class="pb-5.75"/>
            <span class="uppercase font-Inter font-semibold text-[18px] text-[#3A3845]">TableWare</span>
        </div>
        <div class="text-center">
            <img src="./src/img/Categories/Home decor.svg" class="pb-5.75"/>
            <span class="uppercase font-Inter font-semibold text-[18px] text-[#3A3845]">Home decor</span>
        </div>
        <div class="text-center">
            <img src="./src/img/Categories/Holiday.svg" class="pb-5.75"/>
            <span class="uppercase font-Inter font-semibold text-[18px] text-[#3A3845]">holiday</span>
        </div>
        <div class="text-center">
            <img src="./src/img/Categories/Collection.svg" class="pb-5.75"/>
            <span class="uppercase font-Inter font-semibold text-[18px] text-[#3A3845]">Collection</span>
        </div>
    </div>
</section>
